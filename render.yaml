services:
  - type: web
    name: vsla-manase-backend
    runtime: node
    plan: free
    rootDir: backend
    # db:setup applies the schema migrations (it is idempotent), so columns like
    # users.email and tables like transaction_corrections exist after every deploy.
    buildCommand: npm install && npm run db:setup
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SMS_DRY_RUN
        value: "true"
      - key: TEXTBEE_API_KEY
        sync: false
      - key: TEXTBEE_DEVICE_ID
        sync: false
      - key: LOG_REQUESTS
        value: "false"
