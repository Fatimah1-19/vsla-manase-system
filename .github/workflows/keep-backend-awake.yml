name: Keep backend awake

# Render's free plan puts the API to sleep after ~15 minutes with no traffic,
# which makes the public home page lose its numbers until someone visits.
# This pings the health check every 10 minutes to keep it awake.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API health check
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 90 https://vsla-manase-system.onrender.com/api/health && exit 0
            sleep 10
          done
          echo "The backend did not answer this time."
